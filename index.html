<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Düsseldorf — Carnival Survival</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* Custom Styling */
    .splash-skyline {
      width: 100%;
      max-width: 360px;
      height: 80px;
      margin: 0 auto 48px;
      opacity: 0.6;
      background: url('data:image/jpeg;base64,VALID_IMAGE_DATA') no-repeat;
      background-size: contain;
    }
  </style>
</head>
<body>
  <!-- SPLASH SCREEN SECTION -->
  <div class="splash-screen" id="splash">
    <div class="splash-content">
      <h1 class="splash-title">DÜSSELDORF</h1>
      <p class="splash-subtitle">Carnival Survival Guide</p>
      <div class="splash-skyline"></div>
      <button class="enter-btn" onclick="enterApp()">Enter</button>
      <p class="splash-hint">Your emergency guide for carnival nights</p>
    </div>
  </div>
  <script>
    // Function Debug
    function enterApp() {
      // Error-proof initialization of main sections
      const splashElement = document.getElementById("splash");
      const mainElement = document.getElementById("mainApp");

      if (splashElement && mainElement) {
        splashElement.classList.add('hidden');
        mainElement.classList.add('visible');
      } else {
        console.error("Required elements not found for splash transition.");
      }

      // Additional startup logic
      loadTheme();
      initHomeMap();
      loadWeather();
      trackLocation();
    }
  </script>
</body>
</html>
